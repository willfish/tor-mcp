[package]
name = "onion-browser"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lazy Tor Browser automation for AI agents"
repository = "https://github.com/willfish/onion-browser"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
sha3 = "0.10"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
tempfile = "3"
